<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Memora</title>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="icon"></div>
        <h1>Memora</h1>

      <div class="content">

      <div class="status" id="status"></div>

      </div>
    </div>

    <script src="popup.js"></script>
  </body>
